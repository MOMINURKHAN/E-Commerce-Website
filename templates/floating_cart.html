<style>
.floating-cart {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 99999;
}
.cart-icon-btn {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #b21f1f;
    color: white;
    border: none;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}
.cart-icon-btn:hover {
    transform: scale(1.1);
}
.cart-count-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: white;
    color: #b21f1f;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
}
.mini-cart-panel {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 340px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}
.floating-cart:hover .mini-cart-panel {
    opacity: 1;
    visibility: visible;
}
.mini-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}
.mini-total {
    font-weight: bold;
    margin: 12px 0;
    font-size: 16px;
}
.mini-btn {
    display: block;
    text-align: center;
    padding: 11px;
    margin: 6px 0;
    background: #1a2a6c;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 500;
}
.remove-mini {
    color: #e74c3c;
    font-size: 14px;
    font-weight: 600;
}
</style>

<div class="floating-cart">
    <button class="cart-icon-btn">
        🛒
        {% set cart_list = session.get('cart', []) %}
        {% if cart_list|length > 0 %}
        <span class="cart-count-badge">{{ cart_list|length }}</span>
        {% endif %}
    </button>
    <div class="mini-cart-panel">
        <h4 style="margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #eee;">Your Cart</h4>
        {% if cart_list|length == 0 %}
        <p style="padding:10px 0;">Cart is empty</p>
        {% else %}
            {% for item in cart_list %}
            <div class="mini-item">
                <div>
                    <div>{{ item.name }}</div>
                    <small style="color:#777;">${{ item.price }}</small>
                </div>
                <a href="/remove-from-cart/{{ loop.index0 }}" class="remove-mini">Remove</a>
            </div>
            {% endfor %}
            <div class="mini-total">Total: ${{ cart_list | sum(attribute='price') }}</div>
        {% endif %}
        <a href="/cart" class="mini-btn">View Full Cart</a>
        <a href="/checkout" class="mini-btn" style="background:#b21f1f;">Proceed to Checkout</a>
    </div>
</div>
