<!DOCTYPE html>
<html>
<head>
    <title>Products | My Shop</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    {% include 'navbar.html' %}


    <div class="search-bar">
        <form action="/search" method="get">
            <input type="text" name="q" placeholder="Search products...">
            <button type="submit">Search</button>
        </form>
    </div>
    <div class="filter-area" style="text-align:center;margin:20px 0;">
    <form action="/filter-price" method="get">
        <input type="number" name="min" placeholder="Min Price" style="padding:8px;width:120px;margin:0 5px;">
        <span> - </span>
        <input type="number" name="max" placeholder="Max Price" style="padding:8px;width:120px;margin:0 5px;">
        <button type="submit" style="padding:8px 15px;background:#1a2a6c;color:white;border:none;border-radius:5px;">Filter</button>
    </form>
</div>

    <div class="container">
        {% if category %}
        <h1 style="text-align:center; margin-bottom:25px;">Category: {{ category }}</h1>
        {% elif query %}
        <h1 style="text-align:center; margin-bottom:25px;">Search Results for "{{ query }}"</h1>
        {% else %}
        <h1 style="text-align:center; margin-bottom:25px;">All Products</h1>
        {% endif %}

        <div class="product-grid">
            {% for item in items %}
            <div class="product-card">
                <img src="/static/images/{{ item.img }}">
                <h3><a href="/product/{{ item.id }}">{{ item.name }}</a></h3>
                <div class="price">${{ item.price }}</div>
                <a href="/add-to-cart/{{ item.id }}"><button>Add to Cart</button></a>
            </div>
            {% endfor %}
        </div>
    </div>

{% include 'floating_cart.html' %}

</body>
</html>
