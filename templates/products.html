<!DOCTYPE html>
<html>
<head>
    <title>Products | My Shop</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/products">All Products</a>
        <a href="/cart">Cart</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="search-bar">
        <form action="/search" method="get">
            <input type="text" name="q" placeholder="Search products...">
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="container">
        {% if category %}
        <h1 style="text-align:center; margin-bottom:25px;">Category: {{ category }}</h1>
        {% elif query %}
        <h1 style="text-align:center; margin-bottom:25px;">Search Results for "{{ query }}"</h1>
        {% else %}
        <h1 style="text-align:center; margin-bottom:25px;">All Products</h1>
        {% endif %}

        <div class="product-grid">
            {% for item in items %}
            <div class="product-card">
                <img src="/static/images/{{ item.img }}">
                <h3><a href="/product/{{ item.id }}">{{ item.name }}</a></h3>
                <div class="price">${{ item.price }}</div>
                <a href="/add-to-cart/{{ item.id }}"><button>Add to Cart</button></a>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
