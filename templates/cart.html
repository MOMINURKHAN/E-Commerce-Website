<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    {% include 'navbar.html' %}

    <div class="container">
        <h1>Shopping Cart</h1>

        {% if items|length == 0 %}
            <div class="page"><h3>Your cart is empty</h3></div>
        {% else %}
            {% for item in items %}
            <div class="cart-item">
                <div>
                    <h3>{{ item.name }}</h3>
                    <p>${{ item.price }}</p>
                </div>
                <a href="/remove-from-cart/{{ loop.index0 }}">
                    <button class="remove-btn">Remove</button>
                </a>
            </div>
            {% endfor %}

            <div class="total">Total: ${{ total }}</div>
            <br><br>
<a href="/checkout" class="btn" style="background:#27ae60; font-size:18px; padding:14px 30px;">
   Proceed to Checkout
</a>
            <br>
            <a href="/clear-cart" class="btn" style="background:#e74c3c;">Clear Cart</a>
        {% endif %}
    </div>

 {% include 'floating_cart.html' %}
</body>
</html>
