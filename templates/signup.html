<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% include 'navbar.html' %}

<div class="container" style="max-width:500px;">
    <div class="page" style="padding:40px;">
        <h2>Create Account</h2><br>
        <form method="post">
            <input type="text" name="username" placeholder="Username" required style="width:100%;padding:12px;margin:8px 0;">
            <input type="email" name="email" placeholder="Email" required style="width:100%;padding:12px;margin:8px 0;">
            <input type="password" name="password" placeholder="Password" required style="width:100%;padding:12px;margin:8px 0;">
            <button type="submit" class="btn" style="width:100%;">Sign Up</button>
        </form>
        <p style="margin-top:15px;">Already have an account? <a href="/login">Login</a></p>
    </div>
</div>
</body>
</html>
