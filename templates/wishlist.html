<!DOCTYPE html>
<html>
<head>
    <title>My Wishlist</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% include 'navbar.html' %}
<div class="container">
    <div class="page">
        <h1>My Wishlist</h1>
        <div class="product-grid">
            {% for p in products %}
            <div class="product-card">
                <h3>{{ p.name }}</h3>
                <p>${{ p.price }}</p>
                <a href="/product/{{p.id}}">View</a>
                <a href="/remove-wishlist/{{p.id}}">Remove</a>
            </div>
            {% else %}
            <p>No items in wishlist</p>
            {% endfor %}
        </div>
    </div>
</div>
{% include 'floating_cart.html' %}
</body>
</html>
