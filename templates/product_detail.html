<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/cart">Cart</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="container">
        <div class="page">
            <div style="display:flex; gap:30px; flex-wrap:wrap;">
                <img src="/static/images/{{ product.img }}" width="250" height="250" style="border-radius:10px;">
                <div>
                    <h1>{{ product.name }}</h1>
                    <h2 style="color:#e74c3c;">${{ product.price }}</h2>
                    <p style="margin:15px 0; font-size:17px;">{{ product.desc }}</p>
                    <a href="/add-to-cart/{{ product.id }}">
                        <button class="btn" style="border:none;">Add to Cart</button>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
